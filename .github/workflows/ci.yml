name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 and 22 cannot run this toolchain: @sanity/plugin-kit@10
        # requires >=24, and @sanity/pkg-utils@13 requires
        # ^22.18.0 || ^24.11.0 || >=26.0.0.
        node: [24, 26]

    steps:
      - uses: actions/checkout@v7

      # Reads the version from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ordered cheapest-first so failures surface fast. `build` goes last: it
      # is the only step that can rewrite package.json, and it is the slowest.
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - name: Verify the build output contains no untransformed JSX
        run: |
          if grep -qE '(=> <|</[A-Za-z])' dist/index.js; then
            echo "dist/index.js contains raw JSX — check tsconfig.dist.json's jsx setting" >&2
            exit 1
          fi
